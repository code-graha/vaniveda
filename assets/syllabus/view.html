<style>
  body { -webkit-user-select: none; -moz-user-select: none; user-select: none; }

  .syllabus-page { display: block; margin: 16px auto; max-width: calc(100% - 32px); }
  .syllabus-status { padding: 40px 0; text-align: center; color: var(--text-soft); font-size: 14px; }
